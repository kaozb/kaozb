name: Update Profile README

on:
  schedule:
    # 每天 00:00 UTC（北京时间 08:00）自动刷新
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate README
        env:
          # 用仓库自带的 GITHUB_TOKEN 读取组织公开仓库即可
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python update_readme.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet README.md; then
            echo "无变化，跳过提交"
            exit 0
          fi
          git add README.md
          git commit -m "chore: auto-update README"
          # 重试推送，避免与并发提交撞车导致 non-fast-forward 失败
          for i in 1 2 3; do
            if git push; then
              echo "推送成功"
              exit 0
            fi
            echo "推送失败，第 $i 次重试：先同步远端"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" || true
            sleep 3
          done
          echo "推送最终失败"
          exit 1
